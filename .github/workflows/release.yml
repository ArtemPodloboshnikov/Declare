name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows-latest
          - ubuntu-22.04
          - macos-latest
      tag:
        description: "Release tag (e.g., v1.0.0)"
        required: true
        type: string

jobs:
  # ============================================================
  #  СОЗДАЁМ РЕЛИЗ ОДИН РАЗ
  #  Это устраняет гонку между матричными job'ами,
  #  которые параллельно пытались удалять/загружать asset'ы.
  # ============================================================
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      tag_name: ${{ steps.resolve_tag.outputs.tag }}
    steps:
      - name: Resolve tag name
        id: resolve_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          name: "Declare ${{ steps.resolve_tag.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: false

  # ============================================================
  #  МАТРИЧНАЯ СБОРКА
  #  tauri-action добавляет asset'ы в уже существующий релиз.
  # ============================================================
  release:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      # ============================================================
      #  ФИЛЬТР: пропускаем платформы, которые не выбраны вручную
      # ============================================================
      - name: Check if this platform should run
        id: should_run
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          elif [ "${{ inputs.platform }}" = "all" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          elif [ "${{ inputs.platform }}" = "${{ matrix.platform }}" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
            echo "Skipping ${{ matrix.platform }} (only ${{ inputs.platform }} requested)"
          fi

      - name: Checkout
        if: steps.should_run.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.should_run.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        if: steps.should_run.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust
        if: steps.should_run.outputs.run == 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: steps.should_run.outputs.run == 'true' && matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Install frontend dependencies
        if: steps.should_run.outputs.run == 'true'
        run: npm ci

      # ============================================================
      #  BUILD AND RELEASE
      #  tauri-action использует уже существующий релиз по tagName
      #  и добавляет asset'ы. Гонки больше нет — релиз создан один раз.
      # ============================================================
      - name: Build and release
        if: steps.should_run.outputs.run == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: 1
        with:
          tagName: ${{ needs.create-release.outputs.tag_name }}
          releaseName: "Declare ${{ needs.create-release.outputs.tag_name }}"
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
